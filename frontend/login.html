<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLUCODEX // Clinical Authentication Terminal</title>
    <link rel="icon" type="image/jpeg" href="./glucodex.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --bg-paper: #f6f5f0;
        --surface-card: #ffffff;
        --ink-black: #111213;
        --ink-muted: #575752;
        --ink-faint: #92928c;
        --border-heavy: #111213;
        --border-hairline: #dcd9d0;
        --border-subtle: #e8e6df;
        --clinical-red: #b91c1c;
        --clinical-red-bg: #fef2f2;
        --clinical-amber: #b45309;
        --clinical-amber-bg: #fffbeb;
        --clinical-spruce: #15803d;
        --clinical-spruce-bg: #f0fdf4;
        --font-serif: "Fraunces", Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }
      [data-theme="dark"] {
        --bg-paper: #0e0f12;
        --surface-card: #15171c;
        --ink-black: #f4f3ee;
        --ink-muted: #9c9b94;
        --ink-faint: #4e5057;
        --border-heavy: #f4f3ee;
        --border-hairline: #2a2c34;
        --border-subtle: #1c1e24;
        --clinical-red: #ef4444;
        --clinical-red-bg: rgba(239, 68, 68, 0.12);
        --clinical-amber: #f59e0b;
        --clinical-amber-bg: rgba(245, 158, 11, 0.12);
        --clinical-spruce: #10b981;
        --clinical-spruce-bg: rgba(16, 185, 129, 0.12);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
      body {
        background-color: var(--bg-paper);
        color: var(--ink-black);
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        border-top: 4px solid var(--ink-black);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .login-container {
        width: 100%;
        max-width: 420px;
        background: var(--surface-card);
        border: 2px solid var(--border-heavy);
        box-shadow: 6px 6px 0px var(--border-heavy);
        padding: 2.5rem 2rem;
      }
      .login-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-hairline);
      }
      .login-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .login-logo {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        object-fit: cover;
        border: 1.5px solid var(--border-heavy);
        box-shadow: 1px 1px 0px var(--border-heavy);
      }
      .login-title {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink-black);
      }
      .login-spec {
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .theme-toggle-btn {
        background: var(--surface-card);
        border: 2px solid var(--border-heavy);
        color: var(--ink-black);
        padding: 0.5rem 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 3px 3px 0px var(--border-heavy);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.1s ease;
      }
      .theme-toggle-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--border-heavy); }
      .theme-toggle-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-heavy); }
      .auth-tabs {
        display: flex;
        border: 2px solid var(--border-heavy);
        background: var(--bg-paper);
        margin-bottom: 1.5rem;
      }
      .auth-tab {
        flex: 1;
        background: transparent;
        border: none;
        padding: 0.6rem 1rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--ink-muted);
        transition: all 0.1s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }
      .auth-tab:first-child { border-right: 2px solid var(--border-heavy); }
      .auth-tab.active { background: var(--ink-black); color: var(--bg-paper); }
      .auth-tab:hover:not(.active) { background: var(--border-subtle); color: var(--ink-black); }
      .form-group { margin-bottom: 1rem; }
      label.field-label {
        display: block;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 0.35rem;
      }
      .input-wrap { position: relative; }
      .input-wrap i.icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-faint);
        font-size: 0.85rem;
      }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 0.65rem 2.5rem 0.65rem 2.25rem;
        border: 1.5px solid var(--border-heavy);
        background: var(--bg-paper);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-black);
        outline: none;
        transition: all 0.1s ease;
      }
      input:focus { border-color: var(--ink-black); box-shadow: 3px 3px 0px var(--ink-faint); }
      .password-toggle {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--ink-faint);
        font-size: 0.85rem;
        cursor: pointer;
        transition: color 0.1s ease;
      }
      .password-toggle:hover { color: var(--ink-black); }
      .remember-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.65rem;
      }
      .remember-wrap { display: flex; align-items: center; gap: 0.5rem; color: var(--ink-muted); cursor: pointer; }
      .remember-wrap input[type="checkbox"] { accent-color: var(--ink-black); width: 14px; height: 14px; cursor: pointer; }
      .forgot-link { color: var(--ink-black); font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.04em; transition: all 0.1s ease; }
      .forgot-link:hover { color: var(--clinical-red); text-decoration: underline; }
      .btn-primary {
        width: 100%;
        background: var(--ink-black);
        color: var(--bg-paper);
        border: 2px solid var(--border-heavy);
        padding: 0.85rem 1.25rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 3px 3px 0px var(--ink-faint);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.1s ease;
      }
      .btn-primary:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0px var(--border-heavy); }
      .btn-primary:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-heavy); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
      .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0; }
      .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-hairline); }
      .divider span { font-size: 0.62rem; color: var(--ink-muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
      .social-btn {
        width: 100%;
        border: 1.5px solid var(--border-heavy);
        background: var(--bg-paper);
        color: var(--ink-black);
        padding: 0.6rem 1rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.1s ease;
        margin-bottom: 0.5rem;
      }
      .social-btn:hover { background: var(--surface-card); border-color: var(--ink-black); }
      .social-btn img { width: 18px; height: 18px; }
      .alert {
        padding: 0.75rem 1rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        border: 2px solid var(--border-heavy);
        display: none;
      }
      .alert.error { background: var(--clinical-red-bg); color: var(--clinical-red); border-color: var(--clinical-red); display: flex; }
      .alert.success { background: var(--clinical-spruce-bg); color: var(--clinical-spruce); border-color: var(--clinical-spruce); display: flex; }
      .strength-bar { height: 4px; background: var(--border-hairline); margin-top: 0.35rem; overflow: hidden; display: none; }
      .strength-fill { height: 100%; border-radius: 0; transition: width 0.3s, background 0.3s; width: 0%; }
      .strength-label { font-size: 0.6rem; color: var(--ink-muted); margin-top: 0.25rem; display: none; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
      .select-wrap { position: relative; }
      .select-wrap::after {
        content: "";
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid var(--ink-muted);
        pointer-events: none;
      }
      select {
        width: 100%;
        padding: 0.65rem 2.5rem 0.65rem 2.25rem;
        border: 1.5px solid var(--border-heavy);
        background: var(--bg-paper);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-black);
        outline: none;
        appearance: none;
        cursor: pointer;
        transition: all 0.1s ease;
      }
      select:focus { border-color: var(--ink-black); box-shadow: 3px 3px 0px var(--ink-faint); }
      .loader { width: 16px; height: 16px; border: 2px solid var(--border-hairline); border-top-color: var(--bg-paper); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bottom-text { text-align: center; font-size: 0.62rem; color: var(--ink-muted); margin-top: 1.5rem; letter-spacing: 0.04em; }
      .bottom-text a { color: var(--ink-black); font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.1s ease; }
      .bottom-text a:hover { color: var(--clinical-red); text-decoration: underline; }
      :focus-visible { outline: 2px solid var(--clinical-spruce); outline-offset: 2px; }
      button:focus-visible, .auth-tab:focus-visible, .theme-toggle-btn:focus-visible, .btn-primary:focus-visible, .social-btn:focus-visible, .password-toggle:focus-visible, .forgot-link:focus-visible { outline: 2.5px solid var(--clinical-spruce); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="login-container">
      <header class="login-header">
        <div class="login-brand">
          <img src="./glucodex.jpeg" alt="GlucoDex Logo" class="login-logo" />
          <div>
            <div class="login-title">GlucoDex</div>
            <div class="login-spec">Clinical Authentication Terminal</div>
          </div>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Light/Dark Mode" id="themeBtn">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
          <span id="themeLabel">NIGHT LEDGER</span>
        </button>
      </header>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
      </div>
      <div class="alert" id="alert"><i class="fa-solid fa-circle-exclamation"></i><span id="alert-text"></span></div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="field-label">Email Address</label>
          <div class="input-wrap"><i class="icon fa-solid fa-envelope"></i><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"></div>
        </div>
        <div class="form-group">
          <label class="field-label">Password</label>
          <div class="input-wrap">
            <i class="icon fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="Enter your password">
            <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div class="remember-row">
          <label class="remember-wrap"><input type="checkbox" id="remember"> Remember me</label>
          <a class="forgot-link" onclick="showForgot()">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary" id="login-btn"><i class="fa-solid fa-right-to-bracket"></i><span id="login-btn-text">Sign In</span><span class="loader" id="login-loader"></span></button>
        <div class="divider"><span>OR CONTINUE WITH</span></div>
        <button type="button" class="social-btn" onclick="socialLogin('Google')"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">Continue with Google</button>
        <button type="button" class="social-btn" onclick="socialLogin('GitHub')"><i class="fa-brands fa-github" style="font-size:1rem;"></i>Continue with GitHub</button>
      </form>
      <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <div class="form-group"><label class="field-label">First Name</label><div class="input-wrap"><i class="icon fa-solid fa-user"></i><input type="text" id="signup-fname" placeholder="John"></div></div>
          <div class="form-group"><label class="field-label">Last Name</label><div class="input-wrap"><i class="icon fa-solid fa-user"></i><input type="text" id="signup-lname" placeholder="Doe"></div></div>
        </div>
        <div class="form-group"><label class="field-label">Email Address</label><div class="input-wrap"><i class="icon fa-solid fa-envelope"></i><input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email"></div></div>
        <div class="form-group"><label class="field-label">Diabetes Type</label><div class="select-wrap"><i class="icon fa-solid fa-notes-medical" style="left:0.75rem;"></i><select id="signup-type"><option value="">Select your type…</option><option value="type1">Type 1 Diabetes</option><option value="research">Research</option></select></div></div>
        <div class="form-group"><label class="field-label">Password</label><div class="input-wrap"><i class="icon fa-solid fa-lock"></i><input type="password" id="signup-password" placeholder="Create a strong password" oninput="checkStrength(this.value)"><button type="button" class="password-toggle" onclick="togglePassword('signup-password', this)"><i class="fa-solid fa-eye"></i></button></div><div class="strength-bar" id="strength-bar"><div class="strength-fill" id="strength-fill"></div></div><div class="strength-label" id="strength-label"></div></div>
        <div class="form-group"><label class="field-label">Confirm Password</label><div class="input-wrap"><i class="icon fa-solid fa-lock"></i><input type="password" id="signup-confirm" placeholder="Repeat your password"></div></div>
        <button type="submit" class="btn-primary" id="signup-btn"><i class="fa-solid fa-user-plus"></i><span id="signup-btn-text">Create Account</span><span class="loader" id="signup-loader"></span></button>
        <p class="bottom-text">By signing up, you agree to our <a href="#" onclick="return false;">Terms of Service</a> and <a href="#" onclick="return false;">Privacy Policy</a>.</p>
      </form>
    </div>
    <script>
      function toggleTheme() { const isDark = document.documentElement.getAttribute('data-theme') === 'dark'; document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark'); document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun'; document.getElementById('themeLabel').innerText = isDark ? 'NIGHT LEDGER' : 'DAY LEDGER'; localStorage.setItem('glucoTheme', isDark ? 'light' : 'dark'); }
      const savedTheme = localStorage.getItem('glucoTheme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme); document.getElementById('themeIcon').className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon'; document.getElementById('themeLabel').innerText = savedTheme === 'dark' ? 'DAY LEDGER' : 'NIGHT LEDGER';
      function switchTab(tab) { const isLogin = tab === 'login'; document.getElementById('login-form').style.display = isLogin ? 'block' : 'none'; document.getElementById('signup-form').style.display = isLogin ? 'none' : 'block'; document.getElementById('tab-login').classList.toggle('active', isLogin); document.getElementById('tab-signup').classList.toggle('active', !isLogin); clearAlert(); }
      function showAlert(msg, type = 'error') { const el = document.getElementById('alert'); const icon = el.querySelector('i'); el.className = 'alert ' + type; icon.className = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'; document.getElementById('alert-text').innerText = msg; }
      function clearAlert() { document.getElementById('alert').className = 'alert'; }
      function togglePassword(id, btn) { const input = document.getElementById(id); const isText = input.type === 'text'; input.type = isText ? 'password' : 'text'; btn.querySelector('i').className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'; }
      function checkStrength(val) { const bar = document.getElementById('strength-bar'); const fill = document.getElementById('strength-fill'); const lbl = document.getElementById('strength-label'); bar.style.display = lbl.style.display = val ? 'block' : 'none'; let score = 0; if (val.length >= 8) score++; if (/[A-Z]/.test(val)) score++; if (/[0-9]/.test(val)) score++; if (/[^A-Za-z0-9]/.test(val)) score++; const configs = [{ pct:'25%', color: '#ef4444', text:'WEAK' }, { pct:'50%', color: '#f59e0b', text:'FAIR' }, { pct:'75%', color: '#3b82f6', text:'GOOD' }, { pct:'100%', color: '#10b981', text:'STRONG' }]; const cfg = configs[score - 1] || configs[0]; fill.style.width = cfg.pct; fill.style.background = cfg.color; lbl.innerText = 'Password strength: ' + cfg.text; lbl.style.color = cfg.color; }
      async function handleLogin(e) { e.preventDefault(); clearAlert(); const email = document.getElementById('login-email').value.trim(); const pass = document.getElementById('login-password').value; const remember = document.getElementById('remember').checked; if (!email || !pass) { showAlert('Please fill in all fields.'); return; } if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Please enter a valid email address.'); return; } document.getElementById('login-btn').disabled = true; document.getElementById('login-loader').style.display = 'inline-block'; document.getElementById('login-btn-text').style.opacity = '0.7'; await new Promise(r => setTimeout(r, 1200)); const users = JSON.parse(localStorage.getItem('glucoUsers') || '[]'); const user = users.find(u => u.email === email && u.password === btoa(pass)); if (user) { const sessionData = { name: user.name, email: user.email, diabetesType: user.diabetesType, loggedIn: true }; if (remember) localStorage.setItem('glucoSession', JSON.stringify(sessionData)); else sessionStorage.setItem('glucoSession', JSON.stringify(sessionData)); showAlert('Welcome back, ' + user.name.split(' ')[0] + '! Redirecting…', 'success'); setTimeout(() => window.location.replace('/index.html'), 1200); } else { if (email === 'demo@gluco.ai' && pass === 'demo1234') { const demo = { name: 'Demo User', email, diabetesType: 'type1', loggedIn: true }; sessionStorage.setItem('glucoSession', JSON.stringify(demo)); showAlert('Demo login successful! Redirecting…', 'success'); setTimeout(() => window.location.replace('/index.html'), 1200); } else { showAlert('Invalid email or password. Try demo@gluco.ai / demo1234'); } } document.getElementById('login-btn').disabled = false; document.getElementById('login-loader').style.display = 'none'; document.getElementById('login-btn-text').style.opacity = '1'; }
      async function handleSignup(e) { e.preventDefault(); clearAlert(); const fname = document.getElementById('signup-fname').value.trim(); const lname = document.getElementById('signup-lname').value.trim(); const email = document.getElementById('signup-email').value.trim(); const type = document.getElementById('signup-type').value; const pass = document.getElementById('signup-password').value; const conf = document.getElementById('signup-confirm').value; if (!fname || !lname || !email || !type || !pass || !conf) { showAlert('Please fill in all fields.'); return; } if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Please enter a valid email address.'); return; } if (pass.length < 8) { showAlert('Password must be at least 8 characters.'); return; } if (pass !== conf) { showAlert('Passwords do not match.'); return; } document.getElementById('signup-btn').disabled = true; document.getElementById('signup-loader').style.display = 'inline-block'; document.getElementById('signup-btn-text').style.opacity = '0.7'; await new Promise(r => setTimeout(r, 1400)); const users = JSON.parse(localStorage.getItem('glucoUsers') || '[]'); if (users.find(u => u.email === email)) { showAlert('An account with this email already exists.'); document.getElementById('signup-btn').disabled = false; document.getElementById('signup-loader').style.display = 'none'; document.getElementById('signup-btn-text').style.opacity = '1'; return; } users.push({ name: fname + ' ' + lname, email, password: btoa(pass), diabetesType: type, createdAt: new Date().toISOString() }); localStorage.setItem('glucoUsers', JSON.stringify(users)); const sessionData = { name: fname + ' ' + lname, email, diabetesType: type, loggedIn: true }; sessionStorage.setItem('glucoSession', JSON.stringify(sessionData)); showAlert('Account created! Welcome, ' + fname + '! Redirecting…', 'success'); setTimeout(() => window.location.replace('/index.html'), 1400); }
      function showForgot() { showAlert('Password reset link would be sent to your email. (Demo mode)', 'success'); }
      function socialLogin(provider) { showAlert(provider + ' login coming soon! Use email/password for now.', 'success'); }
      const session = JSON.parse(localStorage.getItem('glucoSession') || sessionStorage.getItem('glucoSession') || 'null'); if (session && session.loggedIn) window.location.replace('/index.html');
    </script>
  </body>
</html>
